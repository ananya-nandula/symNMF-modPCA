[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symNMF-modpca"
version = "0.1.0"
description = "Symmetric NMF-based modPCA"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "anndata",
    "scanpy",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]